name: Deploy — ReelAI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Deploy Frontend → Cloudflare Pages ──────────────────────────
  deploy-frontend:
    name: Frontend → Cloudflare Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_RAZORPAY_KEY: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY }}
        run: npm run build
        # next.config.js output: "export" → builds to ./out/

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=reel-ai --branch=main
          workingDirectory: frontend

  # ── 2. Deploy Backend → Render (trigger deploy hooks) ─────────────
  deploy-backend:
    name: Backend → Render
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: []  # runs in parallel with frontend deploy

    steps:
      - uses: actions/checkout@v4

      # Render auto-deploys on push if "Auto Deploy" is enabled in the dashboard.
      # These webhook calls are a manual fallback / ensure ordering if needed.

      - name: Trigger Gateway deploy
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_GATEWAY }}" \
            -H "Content-Type: application/json" | jq .

      - name: Trigger AI Service deploy
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_AI_SERVICE }}" \
            -H "Content-Type: application/json" | jq .

      - name: Trigger Celery Worker deploy
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_CELERY }}" \
            -H "Content-Type: application/json" | jq .

      - name: Wait for Gateway health
        run: |
          echo "Waiting for gateway to come online..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.NEXT_PUBLIC_API_URL }}/health")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Gateway healthy after ${i}x checks"
              exit 0
            fi
            echo "  attempt $i — status $STATUS, retrying in 15s..."
            sleep 15
          done
          echo "❌ Gateway did not come healthy in time"
          exit 1

  # ── 3. Smoke test (runs after both deploys) ────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check Gateway health
        run: |
          curl -sf "${{ secrets.NEXT_PUBLIC_API_URL }}/health" \
            | jq -e '.status == "ok"'
          echo "✅ Gateway OK"

      - name: Check AI Service health
        run: |
          curl -sf "${{ secrets.AI_SERVICE_URL }}/health" \
            | jq -e '.status == "ok"'
          echo "✅ AI Service OK"

      - name: Check Templates endpoint
        run: |
          curl -sf "${{ secrets.NEXT_PUBLIC_API_URL }}/api/templates" | jq length
          echo "✅ Templates endpoint OK"
